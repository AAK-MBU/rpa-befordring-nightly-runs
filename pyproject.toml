[project]
name = "rpa-befordring-nightly-runs"
version = "0.0.2"
description = "Robot der kører natligt og fanger datobaserede ændringer der påvirker befordring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client @ git+https://github.com/odense-rpa/automation-server-client.git",
    "mbu-dev-shared-components>=3.0.0",
    "mbu-rpa-core",
    "pandas",
    "pillow",
    "requests_ntlm >= 1.2.0",
    "ruff",
    "sqlalchemy>=2.0.25",
    "sqlmodel>=0.0.14",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.2.0" }

[tool.setuptools]
py-modules = []

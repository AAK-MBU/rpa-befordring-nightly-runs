[project]
name = "rpa-befordring-nightly-runs"
version = "0.0.2"
description = "Robot der kører natligt og fanger datobaserede ændringer der påvirker befordring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client @ git+https://github.com/odense-rpa/automation-server-client.git",
    "mbu-dev-shared-components>=3.0.0",
    "mbu-rpa-core",
    "pandas",
    "pillow",
    "requests_ntlm >= 1.2.0",
    "ruff",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.2.0" }

[tool.setuptools]
py-modules = []

# Ruff discovers configuration by walking UP from the file being linted, and it
# skips a pyproject.toml that has no [tool.ruff] section. Without this block it
# kept climbing past the repo root and picked up whatever config sat above the
# checkout — so `ruff check` locally enforced a different rule set than CI,
# which checks out this repo alone and therefore found nothing to climb to.
#
# This section exists to stop that search here, so local and CI agree.
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting.
#
# Deliberately NOT enabled:
#
#   BLE  blind-except. Every `except Exception` in this repo is a catch-all on
#        purpose — the ATS retry loop, the per-student distance calls, the
#        workqueue backoff. Each one exists so that a single failure is logged
#        and the run continues rather than taking the night down with it.
#
#   DTZ  timezone-aware datetimes. date.today() in queue_handler builds the
#        workqueue reference, {today}_{action}. It is a local calendar day by
#        intent: the run is scheduled in local time and a caseworker reading the
#        reference expects the date they would write down.
select = ["E4", "E7", "E9", "F", "I"]
